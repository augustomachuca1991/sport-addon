name: Scrape Streams

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Run scraper
        run: node scrapper.js

      - name: Commit generated files
        run: |
          git config user.name "streams-bot"
          git config user.email "bot@localhost"
          git add streams.json docs/
          git diff --cached --quiet || git commit -m "auto: update streams $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
